name: Health diario

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar /api/health de producción
        run: |
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 20 https://mi-page-lake.vercel.app/api/health)
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          test "$code" = "200"
