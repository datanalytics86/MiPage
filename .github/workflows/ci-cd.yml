name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests + coverage thresholds
        run: npm run test:ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start production server
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

      - name: E2E smoke + critical (gates without auth)
        run: npm run test:e2e:critical
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

  supabase-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase env
        run: |
          python3 - << 'PY'
          import os, pathlib
          text = os.popen("supabase status -o env").read()
          vals = {}
          for line in text.splitlines():
              line = line.removeprefix("export ").strip()
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              vals[key.strip()] = value.strip().strip('"').strip("'")
          needed = ("API_URL", "ANON_KEY", "SERVICE_ROLE_KEY")
          missing = [key for key in needed if not vals.get(key)]
          if missing:
              raise SystemExit(f"supabase status sin {', '.join(missing)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"API_URL={vals['API_URL']}\n")
              handle.write(f"ANON_KEY={vals['ANON_KEY']}\n")
              handle.write(f"SERVICE_ROLE_KEY={vals['SERVICE_ROLE_KEY']}\n")
              handle.write(f"NEXT_PUBLIC_SUPABASE_URL={vals['API_URL']}\n")
              handle.write(f"NEXT_PUBLIC_SUPABASE_ANON_KEY={vals['ANON_KEY']}\n")
              handle.write("NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000\n")
          pathlib.Path("/tmp/sb-status.txt").write_text("ok", encoding="utf-8")
          PY

      - name: RLS tests
        run: node scripts/rls-tests.mjs

      - name: Local E2E users
        run: node scripts/e2e-local-users.mjs

      - name: Production build against local Supabase
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start production server
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

      - name: E2E critical against local Supabase
        run: npm run test:e2e:critical
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          E2E_PROVIDER_EMAIL: ${{ env.E2E_PROVIDER_EMAIL }}
          E2E_PROVIDER_PASSWORD: ${{ env.E2E_PROVIDER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}

  deploy-note:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy via Vercel production branch = main only."
