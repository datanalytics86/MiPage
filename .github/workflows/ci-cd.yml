name: CI

on:
  push:
    branches: [main, feat/tier1-supabase-consolidation]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests + coverage thresholds
        run: npm run test:ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Deploy only from main after green CI (Vercel Git integration recommended)
  deploy-note:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy via Vercel production branch = main only. Do not deploy feature branches."
